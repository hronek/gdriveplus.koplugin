name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches _meta.lua
        run: |
          meta=$(sed -n 's/.*version = "\(.*\)".*/\1/p' _meta.lua)
          if [ "v$meta" != "$GITHUB_REF_NAME" ]; then
            echo "::error::_meta.lua has version $meta but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v head="## $ver" '
            /^## / { if (found) exit; if ($0 == head || index($0, head " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver"
            exit 1
          fi

      - name: Run tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit tests/test_core.lua
          luajit tests/test_sync.lua
          luajit tests/test_library.lua

      - name: Package plugin
        run: |
          mkdir -p gdriveplus.koplugin
          cp _meta.lua main.lua gdriveplus_annotations.lua gdriveplus_gjson.lua gdriveplus_library.lua gdriveplus_network.lua gdriveplus_progress.lua gdriveplus_sync.lua gdriveplus_utils.lua LICENSE README.md CHANGELOG.md SYNC_FORMAT.md gdriveplus.koplugin/
          zip -r gdriveplus.koplugin.zip gdriveplus.koplugin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: gdriveplus.koplugin.zip
          body_path: release_notes.md
          generate_release_notes: true
