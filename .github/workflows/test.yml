name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - run: luajit tests/test_core.lua
      - run: luajit tests/test_sync.lua
      - run: luajit tests/test_library.lua
